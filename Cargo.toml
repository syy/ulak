[workspace]
resolver = "3"
members = ["crates/ulak"]

[workspace.package]
version = "0.3.1"
edition = "2024"
# Measured, not assumed: 1.88.0 fails with E0658 "unstable library
# feature `file_lock`" at lockfile.rs:31-69; 1.89.0 checks clean.
rust-version = "1.89"
repository = "https://github.com/syy/ulak"
homepage = "https://github.com/syy/ulak"
documentation = "https://github.com/syy/ulak#readme"
license = "MIT OR Apache-2.0"
keywords = ["docker", "compose", "rsync", "ssh", "remote"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
ignore = "0.4"
libc = "0.2"
inquire = "0.9"
notify = "8"
notify-debouncer-full = "0.7"
# The dashboard behind `ulak ui`. Default features off: no calendar widget,
# no macros, and crossterm is the one backend this crate draws with.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
# Already in the tree through crossterm; named here for its safe signal
# iterator (link.rs), so production code stays free of `unsafe`.
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
unicode-width = "0.2"

# dev
assert_cmd = "2"
insta = "1"
predicates = "3"
tempfile = "3"

[profile.dev]
# File and line in backtraces, no variable info; CARGO_PROFILE_DEV_DEBUG=full for a debugger.
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
