[workspace]
resolver = "3"
members = ["crates/ulak"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Measured, not assumed: 1.88.0 fails with E0658 "unstable library
# feature `file_lock`" at lockfile.rs:31-69; 1.89.0 checks clean.
rust-version = "1.89"
repository = "https://github.com/syy/ulak"
homepage = "https://github.com/syy/ulak"
documentation = "https://github.com/syy/ulak#readme"
license = "MIT OR Apache-2.0"
keywords = ["docker", "compose", "rsync", "ssh", "remote"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
ignore = "0.4"
inquire = "0.9"
notify = "8"
notify-debouncer-full = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# dev
assert_cmd = "2"
insta = "1"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
