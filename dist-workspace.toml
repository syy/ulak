[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# dist publishes the prebuilt-binary formula to our own tap.
tap = "syy/homebrew-tap"
publish-jobs = ["homebrew"]
# Target platforms (MVP DoD): darwin arm64/x86_64 + linux musl.
# ulak is unix-only by nature (ssh + rsync + unix perms).
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Whether to install an updater program
install-updater = false
# Last line of the shell installer. The installer cannot check rsync
# itself; `ulak doctor` can, and this is the one moment the user reads.
install-success-msg = "ulak is installed. In a project with a compose file, run: ulak doctor  (checks this machine, rsync >= 3.2, and your server)"
# No Release checks on pull requests — a release only ever comes from a
# tag. Cost: a broken dist config shows up at tag time, not in the PR.
pr-run-mode = "skip"

# The formula pulls in Homebrew's rsync, so a `brew install` also fixes
# the openrsync problem README tells macOS users to solve by hand.
[dist.dependencies.homebrew]
rsync = { stage = ["run"] }
