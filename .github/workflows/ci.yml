name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A newer push to the same pull request makes the run in progress moot.
# Pushes to main are keyed by commit, so each one keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # The quick checks the e2e jobs wait for, so a formatting slip does not
  # spend five e2e runners. The unit tests run beside them in `linux`.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # A PR's cache serves only that PR; saving it evicts main's, which every PR restores.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # Dry run of `cargo publish`. Cargo fails on a missing readme but
      # not on missing license texts, so those are checked in the archive.
      - name: Package (what crates.io would receive)
        run: |
          cargo package -p ulak --locked --no-verify
          tar tzf target/package/ulak-*.crate | grep -q 'LICENSE-MIT$'
          tar tzf target/package/ulak-*.crate | grep -q 'LICENSE-APACHE$'

  # The unit tests. The e2e suite runs in the `e2e` jobs below.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The agent is for `bake::tests::with_a_real_buildx`, not for ssh:
      # Buildx resolves `ssh = ["default"]` for an ssh-style git context
      # even when only asked to --print, so a runner without one gets a
      # diagnostic where the recorded fixture has a plan. No keys are
      # loaded, and none are needed.
      - name: Tests (e2e skipped)
        run: |
          eval "$(ssh-agent -s)"
          cargo test --workspace
        env:
          ULAK_TEST_E2E: skip

  # The e2e suite against the dockerized sshd fixture, in five jobs that
  # run side by side once `lint` has passed: its targets add up to about
  # 16 minutes. e2e_service is a single test of about 200 s, a floor no
  # split goes below, so group 1 runs it alone and groups 2-4 name targets
  # adding up to about the same. Group 5 runs every other e2e target, so a
  # new one is never left out; rebalance once it outgrows group 1. ubuntu
  # runners allow --privileged, which the DinD fixture needs.
  e2e:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5]
    env:
      E2E_GROUP_1: e2e_service
      E2E_GROUP_2: e2e_flags e2e_passthrough e2e_management_context
      E2E_GROUP_3: e2e_bake e2e_deadline e2e_catalog e2e_context
      E2E_GROUP_4: e2e_sync e2e_namespace e2e_bridge e2e_shapes e2e_composepaths
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The e2e harness never pulls (see `needs_image`): it hands the
      # server a copy from THIS machine's daemon, so the suite cannot go
      # red on Docker Hub's per-IP anonymous limit halfway through a run.
      # A fresh runner's daemon starts empty, so the one pull the harness
      # refuses to make has to happen here — once, before anything runs,
      # where a rate limit is one loud step rather than seven red test
      # binaries. These are every image the suite asks to be seeded; the
      # rest it builds locally.
      - name: Seed the images the e2e suite hands to the server
        run: |
          for image in alpine:3.20 nginx:alpine busybox redis:7.2 registry:2 docker/buildkit-syft-scanner:stable-1; do
            docker pull "$image"
          done
      # --no-fail-fast: a red target must not hide the ones after it. A run
      # that stopped at the first failure once never reached five targets,
      # and nothing said so.
      - name: Tests (e2e group ${{ matrix.group }} via dockerized sshd)
        run: |
          all=$(ls crates/ulak/tests/e2e_*.rs | xargs -n1 basename | sed 's/\.rs$//' | sort)
          named=$(printf '%s\n' $E2E_GROUP_1 $E2E_GROUP_2 $E2E_GROUP_3 $E2E_GROUP_4 | sort)
          for t in $named; do
            [ -f "crates/ulak/tests/$t.rs" ] || { echo "::error::$t is named in ci.yml but crates/ulak/tests/$t.rs does not exist"; exit 1; }
          done
          twice=$(printf '%s\n' "$named" | uniq -d)
          [ -z "$twice" ] || { echo "::error::named in two e2e groups: $twice"; exit 1; }
          case "${{ matrix.group }}" in
            1) mine=$E2E_GROUP_1 ;;
            2) mine=$E2E_GROUP_2 ;;
            3) mine=$E2E_GROUP_3 ;;
            4) mine=$E2E_GROUP_4 ;;
            5) mine=$(comm -23 <(echo "$all") <(echo "$named")) ;;
          esac
          [ -n "$mine" ] || { echo "::error::e2e group ${{ matrix.group }} has no targets"; exit 1; }
          echo "targets: $(echo $mine)"
          # The agent the e2e targets ran under when they shared one job.
          eval "$(ssh-agent -s)"
          ULAK_TEST_E2E_HUB=block cargo test --no-fail-fast $(printf -- '--test %s ' $mine)

  # macOS runners have no docker daemon, so the e2e fixture is skipped.
  # The unit tests still run in full, Buildx included: `bake --print`
  # only evaluates the definition and never reaches a daemon (measured),
  # so the CLI and the plugin are the whole requirement — no Desktop, no
  # Colima. Installing them is not optional politeness. The recordings in
  # bake.rs are checked against the real tool and that check deliberately
  # cannot skip itself, so a runner without Buildx fails the suite rather
  # than quietly covering less than it claims.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # macOS ships Apple's openrsync, which reports "rsync version 2.6.9
      # compatible" and is exactly what `local_rsync` refuses. Without a
      # real one, every command that checks for rsync stops at that check
      # and never reaches the thing the test is about: `ulak doctor` on an
      # unreachable server returned in under a second with a local verdict,
      # so the deadline test was measuring nothing. The runner has to meet
      # the same requirement ulak states to its users.
      - name: rsync >= 3.2
        run: |
          brew install rsync
          "$(brew --prefix)/bin/rsync" --version | head -1
      - name: Docker CLI and Buildx
        run: |
          brew install docker docker-buildx
          mkdir -p ~/.docker/cli-plugins
          ln -sfn "$(brew --prefix)/opt/docker-buildx/bin/docker-buildx" \
            ~/.docker/cli-plugins/docker-buildx
          docker buildx version
      - name: Tests (e2e skipped)
        run: |
          eval "$(ssh-agent -s)"
          cargo test --workspace
        env:
          ULAK_TEST_E2E: skip

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the minimum Rust version
        id: msrv
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import pathlib
          import tomllib

          package = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]
          print(f"version={package['rust-version']}")
          PYTHON
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the minimum supported Rust version
        run: cargo check --locked --all-targets
